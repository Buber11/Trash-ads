spring.application.name=trash

logging.level.org.springframework.web=DEBUG
logging.level.com.twoja.paczka=DEBUG

spring.config.import=optional:secret.properties


#spring.datasource.url=${db.url}
#spring.datasource.username=${db.username}
#spring.datasource.password=${db.password}
spring.datasource.driver-class-name=${driver-class-name}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair=true

# MASTER DB
db.master.url=jdbc:postgresql://localhost:55432/mydb
db.master.username=postgres
db.master.password=postgres

spring.datasource.url=${db.master.url}
spring.datasource.username=${db.master.username}
spring.datasource.password=${db.master.password}

# REPLIKI
db.replica1.url=jdbc:postgresql://localhost:5433/mydb
